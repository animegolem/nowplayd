[package]
name = "nowplayd"
version = "0.1.0"
edition = "2024"

[dependencies]
mpd_protocol = { version = "=1.0.3", features = ["async"] }
souvlaki = { git = "https://github.com/animegolem/souvlaki", rev = "ba2bf7653ace6ae22880ee7eeed623fee938cacf", default-features = false, features = ["use_zbus"] }
tokio = { version = "1.47", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.4"
winit = "=0.30.13"

[dev-dependencies]
tempfile = "3.20"
